<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LectureAI — Architecture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
  }

  svg {
    width: 100%;
    max-width: 1200px;
    height: auto;
    overflow: visible;
  }

  /* Flowing dashed arrows */
  .flow-arrow {
    stroke-dasharray: 8 6;
    animation: flow 1.4s linear infinite;
  }
  .flow-arrow-slow {
    stroke-dasharray: 8 6;
    animation: flow 2s linear infinite;
  }
  @keyframes flow {
    from { stroke-dashoffset: 28; }
    to   { stroke-dashoffset: 0; }
  }

  /* Draw-on load for arrow lines */
  .draw-line {
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: drawLine 0.8s ease forwards;
  }
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  /* Orchestrator glow pulse */
  .orch-glow {
    animation: glowPulse 2.5s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 8px #6366f1aa) drop-shadow(0 0 20px #6366f155); }
    50%       { filter: drop-shadow(0 0 16px #818cf8cc) drop-shadow(0 0 40px #6366f188); }
  }

  /* Staggered fade-in for agent boxes */
  .agent-box { opacity: 0; animation: fadeUp 0.6s ease forwards; }
  .agent-box:nth-child(1) { animation-delay: 0.8s; }
  .agent-box:nth-child(2) { animation-delay: 1.0s; }
  .agent-box:nth-child(3) { animation-delay: 1.2s; }
  .agent-box:nth-child(4) { animation-delay: 1.4s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Top-level boxes slide in */
  .slide-in { opacity: 0; animation: slideIn 0.7s ease forwards; }
  .slide-in-1 { animation-delay: 0.05s; }
  .slide-in-2 { animation-delay: 0.2s; }
  .slide-in-3 { animation-delay: 0.4s; }
  .slide-in-4 { animation-delay: 0.6s; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Service box fade */
  .svc-box { opacity: 0; animation: fadeUp 0.6s ease forwards; }
  .svc-box-1 { animation-delay: 1.6s; }
  .svc-box-2 { animation-delay: 1.8s; }

  /* Arrow delay helpers */
  .arr-delay-1 { animation-delay: 0.3s; }
  .arr-delay-2 { animation-delay: 0.5s; }
  .arr-delay-3 { animation-delay: 0.7s; }
  .arr-delay-4 { animation-delay: 0.9s; }
</style>
</head>
<body>
<svg viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg">

    </linearGradient>

        <feMergeNode in="SourceGraphic"/>

      <feMerge>
        <feMergeNode in="blur"/>
